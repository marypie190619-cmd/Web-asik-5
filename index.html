<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Basics</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Individual Work</h1>

  
  <section>
    <h2>Task 6. Counter with click events</h2>
    <p id="counterDisplay">0</p>
    <button id="increaseBtn">Increase</button>
    <button id="decreaseBtn">Decrease</button>
    <button id="resetBtn">Reset</button>
  </section>

  
  <section>
    <h2>Task 7. Live text preview</h2>
    <label for="previewInput">Type something:</label>
    <input type="text" id="previewInput" placeholder="Start typing...">
    <button id="clearBtn" type="button">Clear</button>
    <p id="previewParagraph">Your text will appear here</p>
    <p id="charCount">Characters: 0</p>
  </section>

  
  <section>
    <h2>Task 8. Change an image with a select control</h2>
    <label for="imageSelect">Choose your favorite animal:</label>
    <select id="imageSelect">
      <option value="котята.jpg">Kittens</option>
      <option value="щенята.jpg">Puppies</option>
      <option value="кролики.jpg">Rabbits</option>
    </select>
    <figure>
      <img id="picture" src="котята.jpg" alt="Kittens" width="300">
      <figcaption id="pictureCaption">Kittens</figcaption>
    </figure>
  </section>

  
  <section>
    <h2>Task 9. Keyboard events</h2>
    <label for="keyInput">Focus this input and press keys:</label>
    <input type="text" id="keyInput">
    <p id="keyStatus">Press any key...</p>
    <p id="keyResult"></p>
  </section>

  
  <section>
    <h2>Task 10. Mouse and focus events</h2>
    <p id="cardInstruction">Hover or focus the card below.</p>
    <div id="focusCard" tabindex="0">Focusable Card</div>
  </section>

</body>
</html>
